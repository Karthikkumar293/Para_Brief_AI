<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Summarizer</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;

    background:
        radial-gradient(circle at 20% 10%, rgba(255, 145, 20, 0.20), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(255, 80, 20, 0.12), transparent 30%),
        linear-gradient(135deg, #070402, #1b0b03 45%, #080402);
}

/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.smoke {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.18;
    animation: smokeMove 12s ease-in-out infinite alternate;
}

.smoke.one {
    background: #ff7200;
    left: -200px;
    top: -150px;
}

.smoke.two {
    background: #ff3c00;
    right: -250px;
    top: 200px;
    animation-delay: -4s;
}

.smoke.three {
    background: #ffb000;
    left: 35%;
    bottom: -400px;
    animation-delay: -7s;
}

@keyframes smokeMove {
    from {
        transform: translate3d(0, 0, 0) scale(1);
    }

    to {
        transform: translate3d(100px, -60px, 0) scale(1.25);
    }
}

/* Floating particles */

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ff9d24;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff8c00;
    animation: floatParticle linear infinite;
}

@keyframes floatParticle {
    from {
        transform: translateY(110vh);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}

/* =========================================================
   MAIN
========================================================= */

.container {
    position: relative;
    z-index: 2;

    width: min(1100px, 92%);
    margin: auto;

    padding: 70px 0 100px;
}

/* =========================================================
   BADGE
========================================================= */

.badge {
    width: fit-content;
    margin: 0 auto 30px;

    padding: 12px 24px;

    border: 1px solid rgba(255, 166, 70, 0.45);
    border-radius: 999px;

    background: rgba(255, 130, 20, 0.08);
    backdrop-filter: blur(12px);

    color: #ffd39b;
    font-size: 15px;

    box-shadow:
        0 0 30px rgba(255, 120, 0, 0.08),
        inset 0 0 20px rgba(255, 150, 40, 0.03);

    animation: badgeGlow 3s ease-in-out infinite;
}

@keyframes badgeGlow {
    50% {
        box-shadow:
            0 0 45px rgba(255, 120, 0, 0.18),
            inset 0 0 20px rgba(255, 150, 40, 0.06);
    }
}

/* =========================================================
   TITLE
========================================================= */

h1 {
    text-align: center;

    font-size: clamp(55px, 9vw, 105px);
    line-height: 0.95;

    font-weight: 900;
    letter-spacing: -5px;

    margin-bottom: 30px;

    background:
        linear-gradient(
            90deg,
            #ffd21c,
            #ff9d00,
            #ff652c,
            #ff9d00,
            #ffd21c
        );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: titleGradient 6s linear infinite;
}

@keyframes titleGradient {
    to {
        background-position: 300% center;
    }
}

.subtitle {
    text-align: center;

    max-width: 800px;
    margin: 0 auto 55px;

    font-size: clamp(18px, 2.2vw, 25px);
    line-height: 1.6;

    color: #d7c8bc;
}

/* =========================================================
   INPUT CARD
========================================================= */

.card {
    position: relative;

    padding: 2px;

    border-radius: 30px;

    background:
        linear-gradient(
            120deg,
            rgba(255, 145, 0, 0.8),
            rgba(255, 70, 0, 0.4),
            rgba(255, 190, 60, 0.8),
            rgba(255, 70, 0, 0.4)
        );

    background-size: 300% 300%;

    animation: borderFlow 6s ease infinite;

    box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.6),
        0 0 60px rgba(255, 100, 0, 0.08);
}

@keyframes borderFlow {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

.card-inner {
    background: rgba(13, 7, 3, 0.92);

    border-radius: 28px;

    overflow: hidden;

    backdrop-filter: blur(20px);
}

textarea {
    display: block;

    width: 100%;
    height: 300px;

    resize: vertical;

    border: none;
    outline: none;

    padding: 32px;

    background: transparent;

    color: #fff;

    font-family: inherit;
    font-size: 18px;
    line-height: 1.7;
}

textarea::placeholder {
    color: #8d8179;
}

.card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 18px 22px 20px;

    border-top: 1px solid rgba(255,255,255,0.07);
}

.counter {
    color: #8d8179;
    font-size: 14px;
}

.summarize-btn {
    border: none;

    padding: 15px 28px;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #ff7900,
            #ffc400
        );

    color: #090502;

    font-weight: 800;
    font-size: 16px;

    cursor: pointer;

    transition: 0.25s ease;

    box-shadow:
        0 10px 35px rgba(255, 120, 0, 0.25);
}

.summarize-btn:hover {
    transform: translateY(-3px) scale(1.02);

    box-shadow:
        0 15px 45px rgba(255, 120, 0, 0.4);
}

.summarize-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
}

/* =========================================================
   GENERATING SECTION
========================================================= */

.generating {
    display: none;

    margin-top: 45px;

    text-align: center;

    animation: fadeIn 0.5s ease;
}

.generating.active {
    display: block;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================================================
   3D LIGHT ANIMATION
========================================================= */

.ai-orb {
    position: relative;

    width: 150px;
    height: 150px;

    margin: 0 auto 30px;

    transform-style: preserve-3d;

    animation: orbRotate 5s linear infinite;
}

@keyframes orbRotate {
    from {
        transform: rotateX(0deg) rotateY(0deg);
    }

    to {
        transform: rotateX(360deg) rotateY(360deg);
    }
}

.orb-core {
    position: absolute;

    width: 70px;
    height: 70px;

    left: 40px;
    top: 40px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #ffd36b 10%,
            #ff8a00 35%,
            #ff3000 70%,
            transparent 72%
        );

    box-shadow:
        0 0 20px #ffb000,
        0 0 50px #ff7500,
        0 0 100px rgba(255, 70, 0, 0.7);

    animation: corePulse 1.5s ease-in-out infinite;
}

@keyframes corePulse {
    50% {
        transform: scale(1.2);

        box-shadow:
            0 0 35px #ffd000,
            0 0 80px #ff7500,
            0 0 140px rgba(255, 70, 0, 0.8);
    }
}

.orbit {
    position: absolute;

    left: 0;
    top: 55px;

    width: 150px;
    height: 40px;

    border: 2px solid rgba(255, 165, 40, 0.7);

    border-radius: 50%;

    box-shadow:
        0 0 20px rgba(255, 130, 0, 0.5);

    transform: rotateX(65deg);
}

.orbit.two {
    transform: rotateY(65deg);
}

.orbit.three {
    transform: rotateX(65deg) rotateY(65deg);
}

.generating-text {
    color: #ffd39b;
    font-size: 18px;
    letter-spacing: 1px;
}

.dots::after {
    content: "";
    animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
    0% {
        content: "";
    }

    25% {
        content: ".";
    }

    50% {
        content: "..";
    }

    75% {
        content: "...";
    }

    100% {
        content: "";
    }
}

/* =========================================================
   SUMMARY
========================================================= */

.summary-section {
    display: none;

    margin-top: 55px;

    animation: summaryAppear 0.8s ease;
}

.summary-section.active {
    display: block;
}

@keyframes summaryAppear {
    from {
        opacity: 0;
        transform: translateY(35px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.summary-title {
    text-align: center;

    font-size: 28px;
    margin-bottom: 20px;

    color: #ffd18a;
}

.summary-box {
    position: relative;

    padding: 32px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(255, 125, 0, 0.08),
            rgba(255, 255, 255, 0.025)
        );

    border: 1px solid rgba(255, 145, 40, 0.3);

    box-shadow:
        0 20px 70px rgba(0,0,0,0.5),
        inset 0 0 40px rgba(255,120,0,0.03);

    overflow: hidden;
}

.summary-box::before {
    content: "";

    position: absolute;

    top: 0;
    left: -150%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 190, 80, 0.08),
            transparent
        );

    transform: skewX(-20deg);

    animation: summaryLight 5s ease-in-out infinite;
}

@keyframes summaryLight {
    0% {
        left: -150%;
    }

    50% {
        left: 150%;
    }

    100% {
        left: 150%;
    }
}

.summary-text {
    position: relative;
    z-index: 2;

    color: #eee2d7;

    font-size: 19px;
    line-height: 1.8;

    white-space: pre-wrap;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    text-align: center;

    margin-top: 70px;

    color: #75675e;

    font-size: 14px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .container {
        padding-top: 45px;
    }

    h1 {
        font-size: 55px;
        letter-spacing: -3px;
    }

    .subtitle {
        font-size: 17px;
        margin-bottom: 35px;
    }

    textarea {
        height: 260px;
        padding: 22px;
    }

    .card-bottom {
        flex-direction: column;
        gap: 15px;
        align-items: stretch;
    }

    .summarize-btn {
        width: 100%;
    }

    .summary-box {
        padding: 22px;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background">

    <div class="smoke one"></div>
    <div class="smoke two"></div>
    <div class="smoke three"></div>

</div>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">

    <div class="badge">
        ✨ AI-POWERED SUMMARIZATION
    </div>

    <h1>
        AI Summarizer
    </h1>

    <p class="subtitle">
        Turn long articles and paragraphs into concise,
        easy-to-read summaries using AI.
    </p>


    <!-- ===================================================
         INPUT
    ==================================================== -->

    <section class="card">

        <div class="card-inner">

            <textarea
                id="textInput"
                placeholder="Paste your article or paragraph here..."
            ></textarea>

            <div class="card-bottom">

                <span
                    class="counter"
                    id="counter"
                >
                    0 characters
                </span>

                <button
                    class="summarize-btn"
                    id="summarizeButton"
                    type="button"
                >
                    Summarize →
                </button>

            </div>

        </div>

    </section>


    <!-- ===================================================
         AI GENERATING ANIMATION
    ==================================================== -->

    <section
        class="generating"
        id="generating"
    >

        <div class="ai-orb">

            <div class="orb-core"></div>

            <div class="orbit"></div>
            <div class="orbit two"></div>
            <div class="orbit three"></div>

        </div>

        <div class="generating-text">
            AI is generating your summary<span class="dots"></span>
        </div>

    </section>


    <!-- ===================================================
         SUMMARY
    ==================================================== -->

    <section
        class="summary-section"
        id="summarySection"
    >

        <h2 class="summary-title">
            ✨ AI Summary
        </h2>

        <div class="summary-box">

            <div
                class="summary-text"
                id="summaryText"
            ></div>

        </div>

    </section>


    <footer class="footer">
        AI Summarization System
    </footer>

</main>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const textInput =
    document.getElementById("textInput");

const counter =
    document.getElementById("counter");

const summarizeButton =
    document.getElementById("summarizeButton");

const generating =
    document.getElementById("generating");

const summarySection =
    document.getElementById("summarySection");

const summaryText =
    document.getElementById("summaryText");


/* =========================================================
   DEBUG CHECK
========================================================= */

console.log("ParaBrief AI loaded.");

console.log("textInput:", textInput);
console.log("counter:", counter);
console.log("summarizeButton:", summarizeButton);
console.log("generating:", generating);
console.log("summarySection:", summarySection);
console.log("summaryText:", summaryText);


/* =========================================================
   CHARACTER COUNTER
========================================================= */

textInput.addEventListener("input", function () {

    counter.textContent =
        textInput.value.length.toLocaleString()
        + " characters";

});


/* =========================================================
   SUMMARIZE BUTTON
========================================================= */

summarizeButton.addEventListener(
    "click",
    summarize
);


/* =========================================================
   REAL FLASK SUMMARIZATION
========================================================= */

async function summarize() {

    const text =
        textInput.value.trim();


    /* -----------------------------------------------------
       EMPTY INPUT
    ----------------------------------------------------- */

    if (!text) {

        textInput.focus();

        return;
    }


    /* -----------------------------------------------------
       RESET OLD SUMMARY
    ----------------------------------------------------- */

    summarySection.classList.remove(
        "active"
    );

    summaryText.textContent = "";


    /* -----------------------------------------------------
       DISABLE BUTTON
    ----------------------------------------------------- */

    summarizeButton.disabled = true;


    /* -----------------------------------------------------
       SHOW AI ANIMATION
    ----------------------------------------------------- */

    generating.classList.add(
        "active"
    );


    try {

        console.log(
            "Sending text to Flask..."
        );


        /* =================================================
           REAL BACKEND REQUEST
        ================================================= */

        const response =
            await fetch(
                "/summarize",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text: text
                    })
                }
            );


        console.log(
            "HTTP status:",
            response.status
        );


        /* =================================================
           READ SERVER RESPONSE
        ================================================= */

        const data =
            await response.json();


        console.log(
            "Flask response:",
            data
        );


        /* =================================================
           BACKEND ERROR
        ================================================= */

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Server error."
            );

        }


        /* =================================================
           CHECK SUMMARY
        ================================================= */

        if (
            !data.summary ||
            typeof data.summary !== "string" ||
            data.summary.trim() === ""
        ) {

            throw new Error(
                "Server returned an empty summary."
            );

        }


        /* =================================================
           STOP GENERATING ANIMATION
        ================================================= */

        generating.classList.remove(
            "active"
        );


        /* =================================================
           SHOW SUMMARY SECTION
        ================================================= */

        summarySection.classList.add(
            "active"
        );


        /* =================================================
           DISPLAY REAL AI SUMMARY
        ================================================= */

        await typeSummary(
            data.summary.trim()
        );


        console.log(
            "AI SUMMARY:",
            data.summary
        );


    } catch (error) {

        console.error(
            "Summarization error:",
            error
        );


        generating.classList.remove(
            "active"
        );


        summarySection.classList.add(
            "active"
        );


        summaryText.textContent =
            "Error: " + error.message;

    } finally {

        summarizeButton.disabled =
            false;

    }

}


/* =========================================================
   SUMMARY TYPING ANIMATION
========================================================= */

async function typeSummary(text) {

    summaryText.textContent = "";


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        summaryText.textContent +=
            text[i];


        await new Promise(
            function (resolve) {

                setTimeout(
                    resolve,
                    8
                );

            }
        );

    }

}


/* =========================================================
   CTRL + ENTER
========================================================= */

textInput.addEventListener(
    "keydown",
    function (event) {

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key === "Enter"
        ) {

            event.preventDefault();


            if (
                !summarizeButton.disabled
            ) {

                summarizeButton.click();

            }

        }

    }
);


/* =========================================================
   PARTICLES
========================================================= */

const background =
    document.querySelector(
        ".background"
    );


if (background) {

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "particle";

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.animationDuration =
            (8 + Math.random() * 15) + "s";

        particle.style.animationDelay =
            (-Math.random() * 15) + "s";

        particle.style.opacity =
            Math.random();

        background.appendChild(
            particle
        );

    }

}

</script>

</body>
</html>
